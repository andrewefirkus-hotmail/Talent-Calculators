# Settings for mypy, the type checker. Run it with:  python -m mypy
# It reads the type hints and reports mismatches before the code ever runs (like the C# compiler).
[mypy]
files = app.py, models.py, talent_build.py, build_css.py
# strict turns on every check: every function needs hints, no silent "Any", no unchecked None.
strict = True
# Flask's @app.post and @app.template_global are typed loosely, which strict mode reports on
# every route. The functions underneath are still fully checked.
disallow_untyped_decorators = False

# libsass ships without type hints, so tell mypy not to complain about it.
[mypy-sass]
ignore_missing_imports = True
